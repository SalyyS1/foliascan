name: "FoliaScan"
description: "Bytecode static analysis gate for Minecraft Paper, Folia, and Spigot plugin JARs."
author: "SalyVn"

branding:
  icon: "shield"
  color: "blue"

inputs:
  jar:
    description: "Plugin JAR path(s), glob pattern(s), or directory of JARs (space- or newline-separated)."
    required: true
  fail-on:
    description: "Lowest severity that causes a non-zero exit code: blocker, critical, warning, info, or never."
    required: false
    default: "critical"
  baseline:
    description: "Optional baseline JSON file path used to suppress accepted findings."
    required: false
    default: ""
  disable:
    description: "Optional comma- or space-separated rule IDs to disable (for example: FS063,FS070)."
    required: false
    default: ""
  all:
    description: "Scan relocated third-party dependency packages as well (true or false)."
    required: false
    default: "false"
  sarif-file:
    description: "Optional output file path for a SARIF 2.1.0 report."
    required: false
    default: ""
  version:
    description: "FoliaScan release version to download (for example: 0.3.0)."
    required: false
    default: "0.3.0"

outputs:
  exit-code:
    description: "Exit code returned by FoliaScan for the configured fail-on threshold."
    value: ${{ steps.scan.outputs.exit-code }}
  json-report:
    description: "Path to the generated machine-readable FoliaScan JSON report."
    value: ${{ steps.scan.outputs.json-report }}
  sarif-file:
    description: "Path to the generated SARIF 2.1.0 report when sarif-file is configured."
    value: ${{ steps.scan.outputs.sarif-file }}

runs:
  using: "composite"
  steps:
    - name: Cache FoliaScan CLI JAR
      uses: actions/cache@v4
      with:
        path: ~/.cache/foliascan
        key: foliascan-cli-${{ runner.os }}-${{ inputs.version }}

    - name: Resolve FoliaScan CLI JAR and Java 21+ runtime
      id: setup
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail

        resolve_java21() {
          local candidate major
          for candidate in \
            "$(command -v java 2>/dev/null || true)" \
            "${JAVA_HOME_21_X64:-}/bin/java" \
            "${JAVA_HOME_21_ARM64:-}/bin/java" \
            "${JAVA_HOME:-}/bin/java"; do
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              major=$("$candidate" -version 2>&1 | sed -n 's/.*version "\([0-9][0-9]*\).*/\1/p' | head -n 1)
              if [[ -n "$major" && "$major" -ge 21 ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            fi
          done
          return 1
        }

        JAVA_BIN="$(resolve_java21 || true)"
        if [[ -z "$JAVA_BIN" ]]; then
          echo "::error::FoliaScan requires Java 21 or newer. Add actions/setup-java@v4 with java-version: '21' before running FoliaScan." >&2
          exit 2
        fi

        VERSION="${INPUT_VERSION#v}"
        if [[ ! "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
          echo "::error::Invalid FoliaScan version '${INPUT_VERSION}'." >&2
          exit 2
        fi

        CACHE_DIR="${HOME}/.cache/foliascan"
        mkdir -p "$CACHE_DIR"
        CACHED_JAR="${CACHE_DIR}/foliascan-${VERSION}.jar"

        is_valid_zip() {
          local file="$1"
          [[ -s "$file" ]] || return 1
          local magic
          magic="$(head -c 4 "$file" | od -An -tx1 | tr -d ' \n')"
          [[ "$magic" == "504b0304" ]]
        }

        if ! is_valid_zip "$CACHED_JAR"; then
          rm -f "$CACHED_JAR"
          DOWNLOAD_URL="https://github.com/SalyyS1/foliascan/releases/download/v${VERSION}/foliascan-${VERSION}.jar"
          echo "Downloading FoliaScan v${VERSION} from ${DOWNLOAD_URL} ..."
          TMP_JAR="${CACHED_JAR}.tmp.$$"
          if curl -fsSL --retry 3 --connect-timeout 15 -o "$TMP_JAR" "$DOWNLOAD_URL" && is_valid_zip "$TMP_JAR"; then
            mv "$TMP_JAR" "$CACHED_JAR"
          else
            rm -f "$TMP_JAR"
            if [[ -x "${ACTION_PATH}/gradlew" || -f "${ACTION_PATH}/gradlew" ]]; then
              echo "Release download unavailable; building FoliaScan locally from action checkout ..."
              JAVA_HOME_FOR_BUILD="$(cd "$(dirname "$JAVA_BIN")/.." && pwd)"
              (
                cd "$ACTION_PATH"
                chmod +x ./gradlew
                JAVA_HOME="$JAVA_HOME_FOR_BUILD" ./gradlew shadowJar jar --no-daemon
              )
              BUILT_JAR="$(find "${ACTION_PATH}/build/libs" -maxdepth 1 -type f -name 'foliascan-*.jar' ! -name '*-thin.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
              if [[ -z "$BUILT_JAR" ]]; then
                BUILT_JAR="$(find "${ACTION_PATH}/build/libs" -maxdepth 1 -type f -name 'foliascan-*.jar' | sort | head -n 1)"
              fi
              if [[ -z "$BUILT_JAR" ]] || ! is_valid_zip "$BUILT_JAR"; then
                echo "::error::Fallback Gradle build did not produce a valid FoliaScan JAR." >&2
                exit 2
              fi
              cp "$BUILT_JAR" "$CACHED_JAR"
            else
              echo "::error::Failed to download FoliaScan v${VERSION} from ${DOWNLOAD_URL}." >&2
              exit 2
            fi
          fi
        fi

        echo "java-bin=${JAVA_BIN}" >> "$GITHUB_OUTPUT"
        echo "jar-path=${CACHED_JAR}" >> "$GITHUB_OUTPUT"

    - name: Run FoliaScan and publish compatibility summary
      id: scan
      shell: bash
      env:
        JAVA_BIN: ${{ steps.setup.outputs.java-bin }}
        FOLIASCAN_JAR: ${{ steps.setup.outputs.jar-path }}
        INPUT_JAR: ${{ inputs.jar }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_DISABLE: ${{ inputs.disable }}
        INPUT_ALL: ${{ inputs.all }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set -euo pipefail

        PY_BIN="$(command -v python3 2>/dev/null || command -v python 2>/dev/null || true)"
        if [[ -z "$PY_BIN" ]]; then
          echo "::error::python3 or python is required to render the GitHub Step Summary." >&2
          exit 2
        fi

        "$PY_BIN" - <<'PY'
        import glob
        import json
        import os
        import shlex
        import subprocess
        import sys
        from collections import Counter
        from pathlib import Path

        java_bin = os.environ["JAVA_BIN"]
        foliascan_jar = os.environ["FOLIASCAN_JAR"]
        raw_jar = os.environ.get("INPUT_JAR", "").strip()
        fail_on = (os.environ.get("INPUT_FAIL_ON", "critical").strip() or "critical").lower()
        baseline = os.environ.get("INPUT_BASELINE", "").strip()
        disable_raw = os.environ.get("INPUT_DISABLE", "").strip()
        scan_all = os.environ.get("INPUT_ALL", "false").strip().lower() in {"true", "1", "yes"}
        sarif_file = os.environ.get("INPUT_SARIF_FILE", "").strip()

        valid_thresholds = {"blocker": 4, "critical": 3, "warning": 2, "info": 1, "never": 99}
        if fail_on not in valid_thresholds:
            print(f"::error::Invalid fail-on value '{fail_on}'. Expected blocker, critical, warning, info, or never.", file=sys.stderr)
            sys.exit(2)

        tokens: list[str] = []
        for line in raw_jar.splitlines():
            line = line.strip()
            if not line:
                continue
            try:
                tokens.extend(shlex.split(line))
            except ValueError:
                tokens.extend(line.split())

        targets: list[str] = []
        seen: set[str] = set()
        aux_suffixes = ("-sources.jar", "-javadoc.jar", "-thin.jar")
        for token in tokens:
            has_glob = any(ch in token for ch in "*?[")
            matches = sorted(glob.glob(token, recursive=True)) if has_glob else ([token] if os.path.exists(token) else [])
            if has_glob and len(matches) > 1:
                primary = [m for m in matches if not m.lower().endswith(aux_suffixes)]
                if primary:
                    matches = primary
            for match in matches:
                norm = os.path.normpath(match)
                if norm not in seen:
                    seen.add(norm)
                    targets.append(match)

        if not targets:
            print(f"::error::No JAR files or directories matched jar input: {raw_jar}", file=sys.stderr)
            sys.exit(2)

        common_args: list[str] = []
        if baseline:
            common_args.extend(["--baseline", baseline])
        if disable_raw:
            for rule_id in disable_raw.replace(",", " ").split():
                if rule_id.strip():
                    common_args.extend(["--disable", rule_id.strip()])
        if scan_all:
            common_args.append("--all")

        console_cmd = [java_bin, "-jar", foliascan_jar, *common_args, "--fail-on", fail_on, *targets]
        console_proc = subprocess.run(console_cmd, check=False)
        scan_exit = console_proc.returncode
        if scan_exit == 2:
            sys.exit(2)

        temp_dir = Path(os.environ.get("RUNNER_TEMP") or "/tmp")
        temp_dir.mkdir(parents=True, exist_ok=True)
        json_report_path = temp_dir / "foliascan-report.json"

        sarif_args = ["--sarif", sarif_file] if sarif_file else []
        json_cmd = [
            java_bin, "-jar", foliascan_jar, *common_args,
            "--format", "json", "--fail-on", "never", "-o", str(json_report_path), *sarif_args, *targets,
        ]
        subprocess.run(json_cmd, check=True, stdout=subprocess.DEVNULL)

        report = json.loads(json_report_path.read_text(encoding="utf-8"))
        severity_ranks = {"BLOCKER": 4, "CRITICAL": 3, "WARNING": 2, "INFO": 1}
        threshold_rank = valid_thresholds[fail_on]

        def esc(val: object) -> str:
            return str(val).replace("|", "\\|").replace("\n", " ").strip()

        def code_span(val: object) -> str:
            s = esc(val)
            return f"`` {s} ``" if "`" in s else f"`{s}`"

        lines: list[str] = []
        tool_ver = esc(report.get("toolVersion", "unknown"))
        lines.append(f"### FoliaScan v{tool_ver} Compatibility Summary")
        lines.append("")
        lines.append(f"Gate threshold (`fail-on`): `{fail_on}`")
        lines.append("")
        lines.append("| Artifact | Plugin | Descriptor | folia-supported | Classes | Blocker | Critical | Warning | Info | Verdict |")
        lines.append("| --- | --- | --- | --- | ---: | ---: | ---: | ---: | ---: | --- |")

        all_findings: list[dict] = []
        for jar in report.get("jars", []):
            findings = jar.get("findings", [])
            all_findings.extend(findings)
            counts = Counter(str(f.get("severity", "")).upper() for f in findings)
            worst_rank = max((severity_ranks.get(s, 0) for s in counts), default=0)
            has_patcher = any(f.get("ruleId") == "FS002" for f in findings)

            plugin_label = jar.get("pluginName") or "(library)"
            if jar.get("pluginVersion"):
                plugin_label = f"{plugin_label} {jar['pluginVersion']}"

            has_desc = bool(jar.get("hasDescriptor", True))
            desc_label = "present" if has_desc else "none (library)"

            if not has_desc:
                folia_label = "n/a"
            elif jar.get("declaresFoliaSupport"):
                folia_label = "patched (FS002)" if has_patcher else "true"
            else:
                folia_label = "false"

            if worst_rank >= threshold_rank:
                verdict = "FAIL"
            elif has_patcher:
                verdict = "PATCHED"
            else:
                verdict = "PASS"

            lines.append(
                f"| `{esc(jar.get('jar', ''))}` | {esc(plugin_label)} | {desc_label} | `{folia_label}` | "
                f"{int(jar.get('classesScanned', 0))} | {counts.get('BLOCKER', 0)} | {counts.get('CRITICAL', 0)} | "
                f"{counts.get('WARNING', 0)} | {counts.get('INFO', 0)} | **{verdict}** |"
            )

        if all_findings:
            lines.append("")
            lines.append("#### Top Rule Hits")
            lines.append("")
            lines.append("| Rule | Severity | Hits | Title | Sample Evidence |")
            lines.append("| --- | --- | ---: | --- | --- |")
            grouped: dict[tuple[str, str], list[dict]] = {}
            for finding in all_findings:
                key = (str(finding.get("ruleId", "")), str(finding.get("severity", "")).upper())
                grouped.setdefault(key, []).append(finding)
            ordered = sorted(
                grouped.items(),
                key=lambda item: (-severity_ranks.get(item[0][1], 0), -len(item[1]), item[0][0]),
            )
            for (rule_id, sev), items in ordered[:15]:
                sample = items[0]
                loc = sample.get("location", {})
                where = loc.get("className", "")
                if loc.get("method"):
                    where = f"{where}#{loc['method']}"
                if loc.get("line") is not None:
                    where = f"{where}:{loc['line']}"
                evidence = sample.get("evidence", "")
                sample_text = f"{code_span(where)} - {code_span(evidence)}" if where else code_span(evidence)
                lines.append(
                    f"| `{esc(rule_id)}` | `{sev.lower()}` | {len(items)} | {esc(sample.get('title', ''))} | {sample_text} |"
                )
        else:
            lines.append("")
            lines.append("No Folia compatibility findings were reported for the scanned target(s).")

        if sarif_file:
            lines.append("")
            lines.append(f"SARIF report written to `{esc(sarif_file)}`.")

        summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
        if summary_path:
            with open(summary_path, "a", encoding="utf-8") as handle:
                handle.write("\n".join(lines) + "\n")

        output_path = os.environ.get("GITHUB_OUTPUT")
        if output_path:
            with open(output_path, "a", encoding="utf-8") as handle:
                handle.write(f"exit-code={scan_exit}\n")
                handle.write(f"json-report={json_report_path}\n")
                handle.write(f"sarif-file={sarif_file}\n")

        sys.exit(scan_exit)
        PY

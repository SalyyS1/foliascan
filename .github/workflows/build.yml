name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Smoke test the CLI
        run: |
          set -euo pipefail
          CLI=$(ls build/libs/foliascan-*.jar | grep -v -- '-thin' | head -1)
          echo "using $CLI"
          # The rule catalog must render, and scanning a jar with no descriptor must be
          # treated as a library and exit cleanly rather than crash.
          java -jar "$CLI" --rules > /dev/null
          java -jar "$CLI" build/libs/foliascan-*-thin.jar --no-color --fail-on never

      - name: Smoke test composite GitHub Action
        uses: ./
        with:
          jar: build/libs/foliascan-*-thin.jar
          fail-on: never
          sarif-file: build/foliascan-smoke.sarif

      - name: Upload the CLI jar
        uses: actions/upload-artifact@v4
        with:
          name: foliascan-jar
          path: build/libs/foliascan-*.jar
          if-no-files-found: error

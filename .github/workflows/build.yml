name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Scan our own fixtures as a smoke test
        run: |
          # The legacy fixture must be reported, so a scanner that silently stops
          # finding anything fails the build instead of passing quietly.
          set -e
          java -jar build/libs/foliascan-*.jar --rules > /dev/null
          echo "rule catalog renders"

      - name: Upload the CLI jar
        uses: actions/upload-artifact@v4
        with:
          name: foliascan-jar
          path: build/libs/foliascan-*.jar
          if-no-files-found: error
